name: Build MCP image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read
  packages: write

# Skip builds triggered by ImageUpdateAutomation commits that only change deploy/flux/
if: |
  github.event_name == 'push' &&
  (
    github.event.head_commit.msg != 'chore(deploy): update image tags' ||
    contains(github.event.head_commit.modified, 'Dockerfile.mcp') ||
    contains(github.event.head_commit.modified, 'mcp-server/')
  )

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/david-hajnal/calendar-mcp
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
