name: Build MCP image

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Version-tagged (vX.Y.Z) releases are published by release-images.yml,
# which gates publication on BOTH images building and passing scans so core
# and MCP promote atomically. This workflow only builds the mutable
# main/SHA tags.
on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile.mcp'
      - 'mcp-server/**'
      - '.github/workflows/build-mcp.yml'
  pull_request:
    paths:
      - 'Dockerfile.mcp'
      - 'mcp-server/**'
      - '.github/workflows/build-mcp.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/david-hajnal/calendar-mcp
          tags: |
            type=semver,pattern=v{{version}}
            type=sha,format=long,prefix=sha-
            type=ref,event=branch

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/david-hajnal/calendar-mcp@${{ steps.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
