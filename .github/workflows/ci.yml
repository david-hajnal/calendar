name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject Yarn lockfiles
        run: sh scripts/check-no-yarn-lock.sh

      - name: Test Yarn lockfile guard
        run: sh scripts/test-check-no-yarn-lock.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Check Rust formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --check

      - name: Check Rust
        run: cargo check --manifest-path backend/Cargo.toml --locked

      - name: Lint Rust
        run: cargo clippy --manifest-path backend/Cargo.toml --all-targets --locked -- -D warnings

      - name: Test Rust
        run: cargo test --manifest-path backend/Cargo.toml --locked

      - name: Validate authorization coverage report
        run: sh scripts/validate-authorization-coverage-report.sh

      - name: Run authorization regression suite
        run: cargo test --manifest-path backend/Cargo.toml --locked --test authorization_regression

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Test frontend
        run: pnpm --dir frontend test

      - name: Lint and typecheck frontend
        run: pnpm --dir frontend lint && pnpm --dir frontend typecheck

      - name: Build frontend
        run: pnpm --dir frontend build

  deploy-validation:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      # TODO: re-enable validate-deploy.sh
      # - name: Run deploy validation
      #   run: bash scripts/validate-deploy.sh

      - name: Test deployment script contract
        run: sh scripts/test-deploy-prod.sh

      - name: Test Helm chart templates
        run: |
          sh deploy/helm/commoncal/tests/template_assertions.sh
          sh deploy/helm/commoncal-mcp/tests/template_assertions.sh

      - name: Check no mutable tags in production
        run: |
          if grep -rn 'tag:.*latest' deploy/flux/overlays/production/ --include='*.yaml' 2>/dev/null; then
            echo "ERROR: Found 'latest' tag in production manifests"
            exit 1
          fi
          if grep -rn 'tag:.*"main"' deploy/flux/overlays/production/ --include='*.yaml' 2>/dev/null; then
            echo "ERROR: Found 'main' tag in production manifests"
            exit 1
          fi
        shell: bash

  docker:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_TAG: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORMS: linux/amd64
        run: scripts/docker-build-push.sh
