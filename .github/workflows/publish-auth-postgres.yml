name: Publish OAuth PostgreSQL image
on:
  push:
    branches: [main]
    paths:
      - Dockerfile.auth-postgres
      - deploy/postgres/**
      - .github/workflows/publish-auth-postgres.yml
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Build database and backup image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.auth-postgres
          pull: true
          load: true
          tags: ghcr.io/david-hajnal/calendar-auth-postgres:sha-${{ github.sha }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/david-hajnal/calendar-auth-postgres:sha-${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish scanned immutable image
        run: docker push ghcr.io/david-hajnal/calendar-auth-postgres:sha-${{ github.sha }}
