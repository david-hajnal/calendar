name: Release images

# Promotion gate for version-tagged releases.
#
# Core and MCP share a monorepo version and must advance atomically in
# production. Both images are built and scanned first; neither is published
# until both have passed. The publish job then pushes both vX.Y.Z tags
# back-to-back and verifies both registry manifests, so Flux image
# automation never promotes a version whose image does not exist.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.ref_name }}
  SHA_TAG: sha-${{ github.sha }}

jobs:
  build-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: ghcr.io/david-hajnal/calendar-core:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/david-hajnal/calendar-core:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Save image
        run: docker save -o core-image.tar "ghcr.io/david-hajnal/calendar-core:${{ env.IMAGE_TAG }}"

      - name: Upload core image
        uses: actions/upload-artifact@v4
        with:
          name: core-image
          path: core-image.tar

  build-mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build MCP image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: false
          load: true
          tags: ghcr.io/david-hajnal/calendar-mcp:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/david-hajnal/calendar-mcp:${{ env.IMAGE_TAG }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Save image
        run: docker save -o mcp-image.tar "ghcr.io/david-hajnal/calendar-mcp:${{ env.IMAGE_TAG }}"

      - name: Upload MCP image
        uses: actions/upload-artifact@v4
        with:
          name: mcp-image
          path: mcp-image.tar

  publish:
    runs-on: ubuntu-latest
    needs: [build-core, build-mcp]
    steps:
      - name: Download images
        uses: actions/download-artifact@v4
        with:
          path: images

      - name: Load images
        run: |
          docker load -i images/core-image/core-image.tar
          docker load -i images/mcp-image/mcp-image.tar

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push both versioned images
        run: |
          set -euo pipefail
          docker tag "ghcr.io/david-hajnal/calendar-core:${IMAGE_TAG}" "ghcr.io/david-hajnal/calendar-core:${SHA_TAG}"
          docker tag "ghcr.io/david-hajnal/calendar-mcp:${IMAGE_TAG}" "ghcr.io/david-hajnal/calendar-mcp:${SHA_TAG}"
          docker push "ghcr.io/david-hajnal/calendar-core:${IMAGE_TAG}"
          docker push "ghcr.io/david-hajnal/calendar-core:${SHA_TAG}"
          docker push "ghcr.io/david-hajnal/calendar-mcp:${IMAGE_TAG}"
          docker push "ghcr.io/david-hajnal/calendar-mcp:${SHA_TAG}"

      - name: Verify both registry manifests
        run: |
          set -euo pipefail
          for repo in calendar-core calendar-mcp; do
            token=$(curl -s "https://ghcr.io/token?scope=repository:david-hajnal/${repo}:pull" | jq -r .token)
            curl -sf -H "Authorization: Bearer ${token}" \
              "https://ghcr.io/v2/david-hajnal/${repo}/manifests/${IMAGE_TAG}" >/dev/null
            echo "OK: ghcr.io/david-hajnal/${repo}:${IMAGE_TAG} manifest present"
          done
