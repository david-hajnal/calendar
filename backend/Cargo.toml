[package]
name = "commoncal-backend"
version = "2.3.0"
edition = "2024"
publish = false

[dependencies]
aes-gcm = "0.10"
pbkdf2 = "0.12"
axum = "0.7.9"
base64 = "0.22"
chrono = "0.4"
chrono-tz = "0.10"
flate2 = "1.1"
futures-util = "0.3"
getrandom = "0.4"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1.49", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
quick-xml = "0.36"
url = "2.5"
uuid = { version = "1.20", features = ["v4"] }

bcrypt = "0.17"
lettre = { version = "=0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }

[[bin]]
name = "db-tools"
path = "src/bin/db_tools.rs"

[dev-dependencies]
quoted_printable = "0.5"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
