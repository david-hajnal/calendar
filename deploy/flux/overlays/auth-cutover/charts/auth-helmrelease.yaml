# Dormant and suspended: replace all candidate image tags with published build SHAs before operator activation.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-auth
  namespace: flux-system
spec:
  releaseName: commoncal-auth
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-auth
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/david-hajnal/calendar-auth
      tag: sha-a52bbc8b75ff93a7a7990234a1473d55190c57f4
      pullPolicy: IfNotPresent
    config:
      issuer: https://auth.hajnal.space
      resourceUrl: https://mcal.hajnal.space/mcp
      commoncalUrl: https://cal.hajnal.space
    public:
      port: 80
      targetPort: 4000
    internal:
      port: 80
      targetPort: 4001
    ingress:
      enabled: true
      className: traefik
      host: auth.hajnal.space
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      tls:
        enabled: true
        secretName: commoncal-auth-tls
    secrets:
      name: commoncal-auth-secrets
      databaseUrlKey: DATABASE_URL
      bridgeKeyKey: AUTH_BRIDGE_KEY
      cookieKeysKey: AUTH_COOKIE_KEYS
      signingKidKey: AUTH_SIGNING_KID
    networkPolicy:
      enabled: true
      ingressNamespace: traefik
      commoncalNamespace: commoncal
      postgres:
        port: 5432
    migration:
      enabled: true
      backoffLimit: 3
      activeDeadlineSeconds: 300
    pdb:
      enabled: true
      minAvailable: 1
    env:
      TZ: Europe/Budapest
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  dependsOn:
  - name: commoncal-auth-postgres
  suspend: true
