# Dormant SQLite authorization release.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-auth
  namespace: flux-system
spec:
  releaseName: commoncal-auth
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-auth
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/david-hajnal/calendar-auth
      tag: "sha-be11209364609959de179d4f3932e292d6b2344c"
      pullPolicy: IfNotPresent
    config:
      issuer: https://auth.hajnal.space
      resourceUrl: https://mcal.hajnal.space/mcp
      commoncalUrl: https://cal.hajnal.space
    public:
      port: 80
      targetPort: 4000
    internal:
      port: 80
      targetPort: 4001
    ingress:
      enabled: true
      className: traefik
      host: auth.hajnal.space
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      tls:
        enabled: true
        secretName: commoncal-auth-tls
    secrets:
      name: commoncal-auth-secrets
      bridgeKeyKey: AUTH_BRIDGE_KEY
      cookieKeysKey: AUTH_COOKIE_KEYS
      signingKidKey: AUTH_SIGNING_KID
    networkPolicy:
      enabled: true
      ingressNamespace: traefik
      commoncalNamespace: commoncal
    migration:
      enabled: true
    pdb:
      enabled: true
      minAvailable: 1
    env:
      TZ: Europe/Budapest
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      size: 1Gi
      storageClass: ''
      accessModes:
      - ReadWriteOnce
      databasePath: /app/data/auth.sqlite
