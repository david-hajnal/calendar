# This HelmRelease was generated by flux-image-automation workflow.
# Do not edit manually — use ImageUpdateAutomation or commit changes directly.
#
# The authorization server (calendar-auth) is deployed BEFORE CommonCal in the
# rollout order: the bridge (private service) must be reachable before CommonCal
# is wired to call it. The issuer is held by CommonCal/MCP without cutover —
# the existing issuer remains primary until an explicit operator cutover.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-auth
  namespace: flux-system
spec:
  releaseName: commoncal-auth
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-auth
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    image:
      repository: ghcr.io/david-hajnal/calendar-auth
      tag: "v0.1.0" # {"$imagepolicy": "flux-system:image-policy-auth:tag"}
      pullPolicy: IfNotPresent
    issuer:
      url: https://cal.hajnal.space
      resourceUrl: https://cal.hajnal.space
      commoncalUrl: https://cal.hajnal.space
    public:
      port: 80
      targetPort: 4000
    internal:
      port: 80
      targetPort: 4001
    ingress:
      enabled: true
      className: traefik
      host: cal.hajnal.space
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      tls:
        enabled: true
        secretName: commoncal-tls
    secrets:
      name: commoncal-auth-secrets
      databaseUrlKey: DATABASE_URL
      bridgeKey: LAB_BRIDGE_KEY
      cookieKeys: AUTH_COOKIE_KEYS
      signingKid: AUTH_SIGNING_KID
    networkPolicy:
      enabled: true
      ingressNamespace: traefik
      commoncalNamespace: commoncal
      postgres:
        port: 5432
    migration:
      enabled: true
      backoffLimit: 3
      activeDeadlineSeconds: 300
    pdb:
      enabled: true
      minAvailable: 1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
