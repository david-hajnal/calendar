apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmChart
metadata:
  name: commoncal-core
  namespace: flux-system
spec:
  interval: 10m
  chart: ./deploy/helm/commoncal
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      repository: ghcr.io/david-hajnal/calendar-core
      tag: latest
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
    persistence:
      size: 10Gi
      accessModes:
        - ReadWriteOnce
    config:
      appOrigin: https://cal.hajnal.space
    existingSecret:
      name: commoncal-session
      sessionSecretKey: SESSION_SECRET
    backup:
      enabled: true
      schedule: "0 2 * * *"
      persistence:
        size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
