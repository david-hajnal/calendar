apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal
  namespace: flux-system
spec:
  releaseName: commoncal
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  dependsOn:
    # The authorization bridge must be reachable before CommonCal is wired to
    # call it. This enforces the rollout order: auth -> commoncal -> mcp.
    - name: commoncal-auth
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      repository: ghcr.io/david-hajnal/calendar-core
      tag: "sha-5e6ff00005e25a67bd364ab7c053f21805083894"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
            - mcal.hajnal.space
    persistence:
      size: 10Gi
      accessModes:
        - ReadWriteOnce
    config:
      appOrigin: https://cal.hajnal.space
    env:
      TZ: Europe/Budapest
    existingSecret:
      name: commoncal-session
      sessionSecretKey: SESSION_SECRET
    mcpInternalApiSecret:
      name: commoncal-mcp-secrets
      key: mcp-internal-api-key
    # Authorization bridge: CommonCal calls the private CommonCal authorization
    # bridge for consent/interaction handoffs. The bridge key (LAB_BRIDGE_KEY)
    # is injected from the commoncal-auth-secrets Secret — never rendered here.
    # The existing issuer remains primary; this is not an issuer cutover.
    authBridge:
      enabled: true
      url: http://commoncal-auth-internal.commoncal.svc:80
      timeoutMs: 5000
      secretName: commoncal-auth-secrets
      secretKey: LAB_BRIDGE_KEY
    backup:
      enabled: true
      schedule: "0 2 * * *"
      persistence:
        size: 5Gi
    networkPolicy:
      enabled: true
      ingress:
        from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
