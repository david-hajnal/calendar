---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-core
  namespace: flux-system
spec:
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      # fluxcd/image-automation: tag={{ .Values.image.tag }}
      repository: ghcr.io/david-hajnal/calendar-core
      tag: "v0.3.4"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
    persistence:
      size: 10Gi
      accessModes:
        - ReadWriteOnce
    config:
      appOrigin: https://cal.hajnal.space
    existingSecret:
      name: commoncal-session
      sessionSecretKey: SESSION_SECRET
    backup:
      enabled: true
      schedule: "0 2 * * *"
      persistence:
        size: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
