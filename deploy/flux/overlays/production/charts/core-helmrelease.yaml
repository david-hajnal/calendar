apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal
  namespace: flux-system
spec:
  releaseName: commoncal
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      repository: ghcr.io/david-hajnal/calendar-core
      tag: "sha-2a96ec716945e9d7fdc5303a1bd232d7cfa703bc"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
            - mcal.hajnal.space
    persistence:
      size: 10Gi
      accessModes:
        - ReadWriteOnce
    config:
      appOrigin: https://cal.hajnal.space
    env:
      TZ: Europe/Budapest
    existingSecret:
      name: commoncal-session
      sessionSecretKey: SESSION_SECRET
    mcpInternalApiSecret:
      name: commoncal-mcp-secrets
      key: mcp-internal-api-key
    backup:
      enabled: true
      schedule: "0 2 * * *"
      persistence:
        size: 5Gi
    networkPolicy:
      enabled: true
      ingress:
        from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: traefik
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
