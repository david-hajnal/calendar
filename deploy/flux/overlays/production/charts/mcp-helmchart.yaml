apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: HelmChart
metadata:
  name: commoncal-mcp
  namespace: flux-system
spec:
  interval: 10m
  chart: ./deploy/helm/commoncal-mcp
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      repository: ghcr.io/david-hajnal/calendar-mcp
      tag: latest
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /mcp
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env:
      CALENDAR_API_URL: http://commoncal-core:3000/api
  dependsOn:
    - name: commoncal-core
