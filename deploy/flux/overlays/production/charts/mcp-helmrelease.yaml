# This HelmRelease was generated by flux-image-automation workflow.
# Do not edit manually — use ImageUpdateAutomation or commit changes directly.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-mcp
  namespace: flux-system
spec:
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-mcp
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  dependsOn:
    - name: commoncal-core
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: mcal.hajnal.space
    bindAddress: "0.0.0.0:3001"
    image:
      # fluxcd/image-automation: tag={{ .Values.image.tag }}
      repository: ghcr.io/david-hajnal/calendar-mcp
      tag: "v2.1.0"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: mcal.hajnal.space
          paths:
            - path: /mcp
              pathType: Prefix
            - path: /.well-known/oauth-protected-resource
              pathType: Exact
      tls:
        - secretName: commoncal-tls
          hosts:
            - mcal.hajnal.space
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    existingSecret:
      name: commoncal-mcp-secrets
      apiKeyKeyName: mcp-internal-api-key
      sessionSecretKeyName: mcp-session-secret
    env:
      APP_ENV: production
      MCP_INTERNAL_API_BASE: http://commoncal-core:3000
      MCP_DOMAIN: mcal.hajnal.space
      MCP_PUBLIC_RESOURCE_URL: https://mcal.hajnal.space/mcp
      MCP_RATE_LIMIT_ENABLED: "1"
