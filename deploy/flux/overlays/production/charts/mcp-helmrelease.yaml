# Do not edit manually — use ImageUpdateAutomation or commit changes directly.
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-mcp
  namespace: flux-system
spec:
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-mcp
      version: "0.1.0"
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  dependsOn:
    - name: commoncal-core
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: cal.hajnal.space
    image:
      # fluxcd/image-automation: tag={{ .Values.image.tag }}
      repository: ghcr.io/david-hajnal/calendar-mcp
      tag: "v1.0.0"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: cal.hajnal.space
          paths:
            - path: /mcp
              pathType: Prefix
      tls:
        - secretName: commoncal-tls
          hosts:
            - cal.hajnal.space
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    env:
      CALENDAR_API_URL: http://commoncal-core:3000/api
