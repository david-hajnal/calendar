apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: commoncal-mcp
  namespace: flux-system
spec:
  releaseName: commoncal-mcp
  targetNamespace: commoncal
  chart:
    spec:
      chart: ./deploy/helm/commoncal-mcp
      reconcileStrategy: Revision
      sourceRef:
        kind: GitRepository
        name: flux-system
      interval: 10m
  interval: 10m
  dependsOn:
    - name: commoncal
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  rollback:
    timeout: 5m0s
  uninstall:
    keepHistory: false
  values:
    replicaCount: 1
    domain: mcal.hajnal.space
    bindAddress: "0.0.0.0:3001"
    image:
      repository: ghcr.io/david-hajnal/calendar-mcp
      tag: "sha-bf638ef55dc4d041a58ab453d840d38fe0e80225"
      pullPolicy: IfNotPresent
    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.entrypoints: websecure
      hosts:
        - host: mcal.hajnal.space
          paths:
            - path: /mcp
              pathType: Prefix
            - path: /.well-known/oauth-protected-resource
              pathType: Exact
      tls:
        - secretName: commoncal-tls
          hosts:
            - mcal.hajnal.space
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 500m
        memory: 256Mi
    networkPolicy:
      enabled: true
      ingress:
        from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: traefik
    existingSecret:
      name: commoncal-mcp-secrets
      apiKeyKeyName: mcp-internal-api-key
      sessionSecretKeyName: mcp-session-secret
      # OAuth issuer source: use env.MCP_OAUTH_ISSUER (public issuer), not Secret.
      # The issuer value is https://auth.hajnal.space — matches the auth HelmRelease.
      oauthIssuerKeyName: ""
    env:
      APP_ENV: production
      MCP_INTERNAL_API_BASE: https://cal.hajnal.space
      MCP_DOMAIN: mcal.hajnal.space
      MCP_PUBLIC_RESOURCE_URL: https://mcal.hajnal.space/mcp
      MCP_OAUTH_ISSUER: https://auth.hajnal.space
      MCP_RATE_LIMIT_ENABLED: "1"
      TZ: Europe/Budapest
