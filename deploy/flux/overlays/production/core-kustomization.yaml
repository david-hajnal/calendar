apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: commoncal-core
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: commoncal
  path: ./deploy/helm/commoncal
  valuesFiles:
    - ./deploy/flux/overlays/production/commoncal-core-values.yaml
  prune: true
  wait: true
  timeout: 10m
  postBuild:
    substitute:
      IMAGE_REPOSITORY: ghcr.io/david-hajnal/calendar-core
      IMAGE_TAG: "{{ .ImageTag }}"
  images:
    - name: commoncal
      newName: ghcr.io/david-hajnal/calendar-core
      newTag: latest
