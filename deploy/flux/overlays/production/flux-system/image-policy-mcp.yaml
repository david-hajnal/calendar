# Flux image policy for calendar-mcp — selects newest semver tag
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImagePolicy
metadata:
  name: image-policy-mcp
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: image-repository-mcp
  policy:
    semver:
      range: ">=0.0.0"
  sort: desc
