# Flux image policy for calendar-mcp
# Selects the highest stable vX.Y.Z tag (main, SHA, latest, and prerelease
# tags are ignored). The production label scopes this policy to the
# production ImageUpdateAutomation.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: image-policy-mcp
  namespace: flux-system
  labels:
    image.fluxcd.io/production: "true"
spec:
  imageRepositoryRef:
    name: image-repository-mcp
  filterTags:
    pattern: '^v(\d+\.\d+\.\d+)$'
    extract: '$1'
  policy:
    semver:
      range: ">=2.1.0"
