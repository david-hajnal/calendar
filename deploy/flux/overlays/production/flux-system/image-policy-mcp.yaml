# Flux image policy for calendar-mcp
# Selects the 'main' tag. The production label scopes this policy to the
# production ImageUpdateAutomation.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: image-policy-mcp
  namespace: flux-system
  labels:
    image.fluxcd.io/production: "true"
spec:
  imageRepositoryRef:
    name: image-repository-mcp
  filterTags:
    pattern: '^main$'
    extract: 'main'
  policy:
    alphabetical: {}
