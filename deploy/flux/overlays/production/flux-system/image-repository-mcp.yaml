# Flux image repository for calendar-mcp
# Public GHCR repository — no provider or credential Secret required.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: image-repository-mcp
  namespace: flux-system
spec:
  image: ghcr.io/david-hajnal/calendar-mcp
  interval: 1m
