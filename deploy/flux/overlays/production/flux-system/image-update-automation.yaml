# Flux image update automation for production
# One automation for both image policies: it commits both HelmRelease tags.
# The policies are evaluated independently, so a promotion may land as one or
# two commits within ~1 minute; both images already exist, so no release ever
# points at a missing image. Commits are pushed to main; Flux reconciles them.
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: image-update-automation
  namespace: flux-system
spec:
  sourceRef:
    kind: GitRepository
    name: flux-system
  interval: 1m
  git:
    checkout:
      ref:
        branch: main
    push:
      branch: main
    commit:
      author:
        name: flux-image-automation
        email: flux@hajnal.space
      messageTemplate: |-
        chore(deploy): update production image tag(s)
        {{- range $resource, $changes := .Changed.Objects }}
        - {{ $resource.Kind }}/{{ $resource.Name }}:
        {{- range $_, $change := $changes }}
          - {{ $change.OldValue }} -> {{ $change.NewValue }}
        {{- end }}
        {{- end }}
  policySelector:
    matchLabels:
      image.fluxcd.io/production: "true"
  update:
    path: ./deploy/flux/overlays/production
    strategy: Setters
