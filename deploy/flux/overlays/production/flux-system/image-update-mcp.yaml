# Flux image update automation for calendar-mcp
# Commits selected image tag changes back to Git
---
apiVersion: image.toolkit.fluxcd.io/v1beta2
kind: ImageUpdateAutomation
metadata:
  name: image-update-mcp
  namespace: flux-system
spec:
  gitRepositoryRef:
    name: flux-system
  push:
    type: github
    branch: main
  commitTemplate: "chore(deploy): update MCP image to {{ .Tag }}"
  commitMessageTemplate: "chore(deploy): update MCP image to {{ .Tag }}"
  interval: 2m0s
  update:
    path: ./deploy/flux/overlays/production
  policy:
    imageNames:
      - name: image-policy-mcp
