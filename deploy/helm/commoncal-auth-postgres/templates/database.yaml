apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: commoncal-auth-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: 1
  serviceName: {{ .Release.Name }}
  selector:
    matchLabels:
      app.kubernetes.io/name: commoncal-auth-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: commoncal-auth-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [postgres, -c, ssl=on, -c, ssl_cert_file=/etc/postgres-tls/tls.crt, -c, ssl_key_file=/etc/postgres-tls/tls.key]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: commoncal_auth}
            - {name: POSTGRES_INITDB_ARGS, value: "--auth-host=scram-sha-256 --auth-local=trust"}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.database }}, key: POSTGRES_PASSWORD}
            - name: AUTH_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.secrets.database }}, key: AUTH_DATABASE_PASSWORD}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d commoncal_auth"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d commoncal_auth"]
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d commoncal_auth"]
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: tls, mountPath: /etc/postgres-tls, readOnly: true}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-data}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tls }}
            defaultMode: 0640
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commoncal-auth-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  egress: []
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.authPodLabels | nindent 14 }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: commoncal-auth-postgres-backup
      ports:
        - {protocol: TCP, port: 5432}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: commoncal-auth-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
