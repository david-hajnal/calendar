{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "commoncal-auth.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: commoncal-auth-backup
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: commoncal-auth-backup
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # RWO volumes can be shared on one node. Place the backup beside auth.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      {{- include "commoncal-auth.selectorLabels" . | nindent 22 }}
                  topologyKey: kubernetes.io/hostname
          containers:
            - name: backup
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "src/backup.mjs"]
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              env:
                - name: AUTH_SQLITE_PATH
                  value: {{ .Values.persistence.databasePath | quote }}
                - name: AUTH_BACKUP_DIR
                  value: /app/data/backups
                - name: AUTH_BACKUP_RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: AGE_RECIPIENT
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backup.secretName }}
                      key: {{ .Values.backup.recipientKey }}
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              volumeMounts:
                - name: data
                  mountPath: /app/data
                - name: work
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: {{ include "commoncal-auth.fullname" . }}-data
            - name: work
              emptyDir:
                medium: Memory
                sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commoncal-auth.fullname" . }}-backup
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: commoncal-auth-backup
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
{{- end }}
