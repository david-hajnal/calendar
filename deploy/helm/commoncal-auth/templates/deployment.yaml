apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "commoncal-auth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commoncal-auth.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "commoncal-auth.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "commoncal-auth.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "commoncal-auth.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: auth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: public
              containerPort: {{ .Values.public.targetPort }}
              protocol: TCP
            - name: private
              containerPort: {{ .Values.internal.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "commoncal-auth.fullname" . }}
          env:
            # Secrets are injected by name reference only — no value is ever
            # rendered into this manifest.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.databaseUrlKey }}
            - name: LAB_BRIDGE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.bridgeKeyKey }}
            - name: AUTH_COOKIE_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.cookieKeysKey }}
            - name: AUTH_SIGNING_KID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.signingKidKey }}
            # The JWKS document is mounted as a read-only file (below) and its
            # path is passed via env. The file content comes from the Secret.
            - name: AUTH_JWKS_FILE
              value: /etc/commoncal-auth/jwks.json
          volumeMounts:
            - name: jwks
              mountPath: /etc/commoncal-auth
              readOnly: true
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: jwks
          secret:
            secretName: {{ .Values.secrets.name }}
            items:
              - key: {{ .Values.secrets.jwksKey }}
                path: jwks.json
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
