{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "commoncal-auth.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commoncal-auth.baseLabels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Re-run the migration on chart change by bumping this checksum. The Job
    # is idempotent (migrations are tracked in the schema_migrations table).
    checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  # Migrations are idempotent; a previously completed Job is not re-run unless
  # the manifest changes (checksum annotation). Use `helm upgrade` to re-trigger.
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "commoncal-auth.selectorBaseLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      serviceAccountName: {{ include "commoncal-auth.serviceAccountName" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Different entrypoint than the server: run the one-shot migration.
          command:
            - node
            - src/migrate.mjs
          envFrom:
            - configMapRef:
                name: {{ include "commoncal-auth.fullname" . }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: {{ .Values.secrets.databaseUrlKey }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
