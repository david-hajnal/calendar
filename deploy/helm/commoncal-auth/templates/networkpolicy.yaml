{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "commoncal-auth.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "commoncal-auth.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "commoncal-auth.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }}
      ports:
        - {protocol: TCP, port: {{ .Values.public.targetPort }}}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.commoncalNamespace }}
          podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.commoncalPodLabels | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.internal.targetPort }}}
  egress: []
{{- end }}
