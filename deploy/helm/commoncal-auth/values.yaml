# SQLite auth: one replica, local persistent storage, encrypted online backups.
image:
  repository: ghcr.io/david-hajnal/calendar-auth
  tag: ''
  pullPolicy: IfNotPresent
imagePullSecrets: []
replicaCount: 1
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: true
  annotations: {}
  name: ''
public:
  port: 80
  targetPort: 4000
internal:
  port: 80
  targetPort: 4001
ingress:
  enabled: true
  className: traefik
  annotations: {}
  host: auth.example.com
  tls:
    enabled: true
    secretName: commoncal-auth-tls
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  commoncalNamespace: commoncal
  commoncalPodLabels:
    app.kubernetes.io/name: commoncal
migration:
  enabled: true
pdb:
  enabled: true
  minAvailable: 1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault
secrets:
  name: commoncal-auth-secrets
  bridgeKeyKey: AUTH_BRIDGE_KEY
  cookieKeysKey: AUTH_COOKIE_KEYS
  jwksKey: AUTH_JWKS
  signingKidKey: AUTH_SIGNING_KID
config:
  issuer: https://auth.example.com
  resourceUrl: https://mcp.example.com/mcp
  commoncalUrl: https://calendar.example.com
  dcrRateLimit: 10
  dcrLoopbackHosts: 127.0.0.1,[::1]
  dcrCallbackPath: /mcp/oauth/callback
  trustProxy: true
livenessProbe:
  httpGet:
    path: /health
    port: public
  initialDelaySeconds: 10
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
readinessProbe:
  httpGet:
    path: /ready
    port: public
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
persistence:
  size: 1Gi
  storageClass: ''
  accessModes:
  - ReadWriteOnce
  databasePath: /app/data/auth.sqlite
backup:
  enabled: true
  schedule: 15 2 * * *
  retentionDays: 14
  secretName: commoncal-auth-backup
  recipientKey: AGE_RECIPIENT
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 192Mi
