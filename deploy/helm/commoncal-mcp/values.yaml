replicaCount: 1

image:
  repository: ghcr.io/david-hajnal/calendar-mcp
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

persistence:
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClass: ""
  annotations: {}

domain: mcp.example.com
bindAddress: "0.0.0.0:3001"

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: mcp.example.com
      paths:
        - path: /mcp
          pathType: Prefix
        - path: /.well-known/oauth-protected-resource
          pathType: Exact
  tls:
    - secretName: commoncal-tls
      hosts:
        - mcp.example.com

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik

existingSecret:
  name: commoncal-mcp-secrets
  apiKeyKeyName: mcp-internal-api-key
  sessionSecretKeyName: mcp-session-secret

env:
  MCP_INTERNAL_API_BASE: http://commoncal:3000
  MCP_DATABASE_PATH: /app/data/mcp-server.db
  MCP_RATE_LIMIT_ENABLED: "0"
