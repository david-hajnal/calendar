apiVersion: v1
kind: ResourceQuota
metadata:
  name: {{ include "commoncal.fullname" . }}-quota
  labels:
    {{- include "commoncal.labels" . | nindent 4 }}
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "20"
    persistentvolumeclaims: "10"
    services: "10"
    configmaps: "20"
    secrets: "20"
