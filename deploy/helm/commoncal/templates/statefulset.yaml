apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "commoncal.fullname" . }}
  labels:
    {{- include "commoncal.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "commoncal.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "commoncal.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "commoncal.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "commoncal.serviceAccountName" . }}
      # Keep this true even when callers supply their own ServiceAccount.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: commoncal
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "commoncal.fullname" . }}
          env:
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret.name is required" .Values.existingSecret.name }}
                  key: {{ required "existingSecret.sessionSecretKey is required" .Values.existingSecret.sessionSecretKey }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /app/tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "commoncal.fullname" . }}-data
        - name: tmp
          emptyDir: {}
