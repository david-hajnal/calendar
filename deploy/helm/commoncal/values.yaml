# The chart is intentionally single-replica because SQLite is stored on one PVC.
replicaCount: 1

image:
  repository: commoncal
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

domain: commoncal.example.com

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: "example.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS configuration:
  # tls:
  #   - secretName: commoncal-tls
  #     hosts:
  #       - commoncal.example.com

persistence:
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  annotations: {}

config:
  appOrigin: "https://example.com"
  caldavPublicOrigin: ""
  passwordLoginEnabled: true

# Required for production account mail. Credentials are supplied only through
# a separately managed Secret; the chart never creates or embeds them.
mail:
  host: ""
  port: 587
  from: ""
  existingSecret:
    name: commoncal-mail
    usernameKey: SMTP_USERNAME
    passwordKey: SMTP_PASSWORD
  # Narrow these to the provider's ranges where stable, or a private relay CIDR.
  egressCIDRs:
    - 0.0.0.0/0

# This Secret is deliberately not created by the chart. Create it separately,
# for example: kubectl create secret generic commoncal-session --from-literal=SESSION_SECRET=...
existingSecret:
  name: commoncal-session
  sessionSecretKey: SESSION_SECRET

mcpInternalApiSecret:
  name: ""
  key: mcp-internal-api-key

# --- Authorization bridge (slice 5) -----------------------------------------
# When enabled, CommonCal calls the private CommonCal authorization bridge
# (the internal service of the commoncal-auth chart) for consent/interaction
# handoffs. The bridge URL is non-secret (cluster-internal DNS); the bridge
# key is injected from a pre-existing Secret (never rendered into a manifest).
authBridge:
  enabled: false
  # URL of the private bridge (internal service of commoncal-auth). Non-secret.
  url: "http://commoncal-auth-internal.commoncal.svc:80"
  # Timeout (seconds) for bridge calls.
  timeoutSecs: 5
  # Pre-existing Secret holding the bridge key. The key must match the
  # AUTH_BRIDGE_KEY used by the authorization server.
  secretName: commoncal-auth-secrets
  secretKey: AUTH_BRIDGE_KEY

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  ingress:
    # k3s deploys Traefik in kube-system by default. Override this selector
    # when using an ingress controller in a different namespace.
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik

backup:
  enabled: false
  schedule: "0 2 * * *"
  backoffLimit: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    size: 5Gi
    storageClass: ""
