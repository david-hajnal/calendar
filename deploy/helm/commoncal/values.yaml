# The chart is intentionally single-replica because SQLite is stored on one PVC.
replicaCount: 1

image:
  repository: commoncal
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: traefik
  annotations: {}
  hosts:
    - host: commoncal.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  # Example TLS configuration:
  # tls:
  #   - secretName: commoncal-tls
  #     hosts:
  #       - commoncal.example.com

persistence:
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  annotations: {}

config:
  appOrigin: https://commoncal.example.com

# This Secret is deliberately not created by the chart. Create it separately,
# for example: kubectl create secret generic commoncal-session --from-literal=SESSION_SECRET=...
existingSecret:
  name: commoncal-session
  sessionSecretKey: SESSION_SECRET

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true
  ingress:
    # k3s deploys Traefik in kube-system by default. Override this selector
    # when using an ingress controller in a different namespace.
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
