# SQLite auth; production activation requires published images and recovery proof.
replicaCount: 1
image:
  repository: ghcr.io/david-hajnal/calendar-auth
  pullPolicy: IfNotPresent
config:
  issuer: https://auth.hajnal.space
  resourceUrl: https://mcal.hajnal.space/mcp
  commoncalUrl: https://cal.hajnal.space
public:
  port: 80
  targetPort: 4000
internal:
  port: 80
  targetPort: 4001
ingress:
  enabled: true
  className: traefik
  host: auth.hajnal.space
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  tls:
    enabled: true
    secretName: commoncal-auth-tls
secrets:
  name: commoncal-auth-secrets
  bridgeKeyKey: AUTH_BRIDGE_KEY
  cookieKeysKey: AUTH_COOKIE_KEYS
  signingKidKey: AUTH_SIGNING_KID
networkPolicy:
  enabled: true
  ingressNamespace: traefik
  commoncalNamespace: commoncal
migration:
  enabled: true
pdb:
  enabled: true
  minAvailable: 1
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi
terminationGracePeriodSeconds: 30
persistence:
  size: 1Gi
  storageClass: ''
  accessModes:
  - ReadWriteOnce
  databasePath: /app/data/auth.sqlite
