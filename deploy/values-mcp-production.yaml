# Production values for commoncal MCP — override with --set or values files

replicaCount: 1

image:
  repository: ghcr.io/david-hajnal/calendar-mcp
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  port: 80

domain: mcal.hajnal.space
bindAddress: "0.0.0.0:3001"

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: mcal.hajnal.space
      paths:
        - path: /mcp
          pathType: Prefix
        - path: /.well-known/oauth-protected-resource
          pathType: Exact
  tls:
    - secretName: commoncal-tls
      hosts:
        - mcal.hajnal.space

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 30

networkPolicy:
  enabled: true

existingSecret:
  name: commoncal-mcp-secrets
  apiKeyKeyName: mcp-internal-api-key
  sessionSecretKeyName: mcp-session-secret
  oauthIssuerKeyName: mcp-oauth-issuer

env:
  APP_ENV: production
  MCP_INTERNAL_API_BASE: https://cal.hajnal.space
  MCP_DATABASE_PATH: /app/data/mcp-server.db
  MCP_DOMAIN: mcal.hajnal.space
  MCP_PUBLIC_RESOURCE_URL: https://mcal.hajnal.space/mcp
  MCP_RATE_LIMIT_ENABLED: "1"
