# Production values for commoncal - override with --set or values files
# Usage: helm upgrade --install commoncal ./deploy/helm/commoncal -f values-production.yaml --namespace production

replicaCount: 1

image:
  repository: ghcr.io/david-hajnal/calendar-core
  pullPolicy: IfNotPresent
  # tag is supplied from deploy/.env by deploy-prod.sh

service:
  type: ClusterIP
  port: 80

domain: cal.hajnal.space

ingress:
  enabled: true
  className: traefik
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
  hosts:
    - host: cal.hajnal.space
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: commoncal-tls
      hosts:
        - cal.hajnal.space

persistence:
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClass: ""
  annotations: {}

config:
  appOrigin: https://cal.hajnal.space

# Secret created externally:
# kubectl create secret generic commoncal-session \
#   --from-literal=SESSION_SECRET=<your-secret> \
#   --from-literal=BACKUP_ENCRYPTION_KEY_HEX=<your-key> \
#   -n production
existingSecret:
  name: commoncal-session
  sessionSecretKey: SESSION_SECRET
  backupEncryptionKeyHex: BACKUP_ENCRYPTION_KEY_HEX

mcpInternalApiSecret:
  name: commoncal-mcp-secrets
  key: mcp-internal-api-key

# Authorization bridge (slice 5): CommonCal calls the private CommonCal
# authorization bridge for consent/interaction handoffs. The bridge URL is
# non-secret (cluster-internal DNS); the bridge key (LAB_BRIDGE_KEY) is
# injected from the commoncal-auth-secrets Secret — never rendered here.
# The existing issuer remains primary; this is not an issuer cutover.
authBridge:
  enabled: true
  url: http://commoncal-auth-internal.commoncal.svc:80
  timeoutMs: 5000
  secretName: commoncal-auth-secrets
  secretKey: LAB_BRIDGE_KEY

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

terminationGracePeriodSeconds: 30

backup:
  enabled: true
  schedule: "0 2 * * *"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
  persistence:
    size: 5Gi

networkPolicy:
  enabled: true
  ingress:
    from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
