# Development overrides: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    env_file: .env.local
    environment:
      - APP_ORIGIN=https://localhost:5173
    ports:
      - "3000:3000"
    volumes:
      - sqlite-data:/app/data
    healthcheck:
      test: ["CMD", "busybox", "wget", "--spider", "-q", "http://127.0.0.1:3000/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
