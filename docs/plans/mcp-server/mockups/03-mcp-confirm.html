<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Confirm Deletion</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card { background: white; border-radius: 16px; box-shadow: 0 4px 24px rgba(0,0,0,0.08); padding: 36px; max-width: 440px; width: 100%; }
  .icon { width: 48px; height: 48px; background: #fef2f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .icon svg { width: 24px; height: 24px; stroke: #dc2626; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .source { font-size: 13px; color: #666; margin-bottom: 24px; }
  .detail { background: #f9fafb; border-radius: 10px; padding: 16px; margin-bottom: 24px; }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .detail-row .label { color: #666; }
  .detail-row .value { font-weight: 500; }
  .detail-row .value.danger { color: #dc2626; }
  .warning { background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 12px 16px; font-size: 12px; color: #9a3412; margin-bottom: 24px; line-height: 1.5; }
  .btn-cancel { width: 100%; padding: 14px; background: transparent; color: #666; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 15px; cursor: pointer; margin-bottom: 8px; }
  .btn-delete { width: 100%; padding: 14px; background: #dc2626; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  </div>
  <h1>Confirm deletion</h1>
  <p class="source">Requested by Claude Desktop</p>

  <div class="detail">
    <div class="detail-row">
      <span class="label">Action</span>
      <span class="value danger">Delete event</span>
    </div>
    <div class="detail-row">
      <span class="label">Calendar</span>
      <span class="value">Family</span>
    </div>
    <div class="detail-row">
      <span class="label">Event</span>
      <span class="value">Dentist appointment</span>
    </div>
    <div class="detail-row">
      <span class="label">Time</span>
      <span class="value">10 August, 14:00</span>
    </div>
  </div>

  <div class="warning">⚠️ This action cannot be undone. The event will be permanently removed from your calendar.</div>

  <button class="btn-cancel">Cancel</button>
  <button class="btn-delete">Delete</button>
</div>
</body>
</html>
