name: MCP Server CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'mcp-server/**'
  pull_request:
    paths:
      - 'mcp-server/**'

env:
  RUST_VERSION: '1.82'
  REGISTRY: ghcr.io

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('mcp-server/Cargo.lock') }}

      - name: Run tests
        run: cargo test --all
        working-directory: mcp-server

      - name: Run clippy
        run: cargo clippy -- -D warnings
        working-directory: mcp-server

  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/mcp-server
          tags: |
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./mcp-server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: builder
          outputs: type=docker,dest=/tmp/mcp-server.tar
          # Only build the binary, not the full image
          build-args: |
            RUSTFLAGS=-C opt-level=z

  deploy:
    name: Deploy to k3s
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          export KUBECONFIG=kubeconfig.yaml

      - name: Apply namespace
        run: kubectl apply -f mcp-server/k8s/namespace.yaml
        env:
          KUBECONFIG: kubeconfig.yaml

      - name: Apply secrets
        run: |
          kubectl apply -f mcp-server/k8s/secret.yaml --namespace=mcp-server
        env:
          KUBECONFIG: kubeconfig.yaml
        continue-on-error: true

      - name: Deploy
        run: |
          IMAGE=${{ env.REGISTRY }}/${{ github.repository }}/mcp-server:${{ github.sha }}
          kubectl set image deployment/mcp-server \
            mcp-server=$IMAGE \
            --namespace=mcp-server
        env:
          KUBECONFIG: kubeconfig.yaml

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/mcp-server \
            --namespace=mcp-server \
            --timeout=120s
        env:
          KUBECONFIG: kubeconfig.yaml
