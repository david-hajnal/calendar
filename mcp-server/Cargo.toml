[package]
name = "mcp-server"
version = "2.1.0"
edition = "2024"

[lib]
name = "mcp_server"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
hyper = { version = "1", features = ["full"] }
http = "1"
http-body-util = "0.1"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde", "std", "alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
jsonwebtoken = "9"
base64 = "0.22"
url = "2"
num-bigint = "0.4"
rsa = "0.9"
rmcp = { version = "3.1.4", features = ["server", "macros", "schemars", "transport-streamable-http-server", "reqwest"] }

[dev-dependencies]
wiremock = "0.6"
serial_test = "3"
rsa = "0.9"
rand = "0.8"
ring = "0.17"
